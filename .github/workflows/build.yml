name: Build Fun City

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify retired-game catalog policy
        run: bash Tests/check-retired-catalog.sh
      - name: Verify release setup script syntax
        run: |
          bash -n scripts/setup-sparkle-signing.sh
          bash -n scripts/check-release-readiness.sh
      - name: Verify development and distribution compile-time channels
        run: |
          set -euo pipefail
          xcodebuild -project FunCity.xcodeproj -scheme FunCity -configuration Debug \
            -showBuildSettings -destination 'platform=macOS' > "$RUNNER_TEMP/debug-settings.txt"
          xcodebuild -project FunCity.xcodeproj -scheme FunCity -configuration Release \
            -showBuildSettings -destination 'platform=macOS' > "$RUNNER_TEMP/release-settings.txt"
          grep -Eq '^[[:space:]]*SWIFT_ACTIVE_COMPILATION_CONDITIONS = .*DEBUG' "$RUNNER_TEMP/debug-settings.txt" || {
            echo "::error::Debug configuration is not compiling development release discovery"
            exit 1
          }
          if grep -Eq '^[[:space:]]*SWIFT_ACTIVE_COMPILATION_CONDITIONS = .*DEBUG' "$RUNNER_TEMP/release-settings.txt"; then
            echo "::error::Distributed Release must not include DEBUG discovery"
            exit 1
          fi
      - name: Build Debug and Release for macOS
        run: |
          set -euo pipefail
          xcodebuild -project FunCity.xcodeproj -scheme FunCity -configuration Debug \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
          xcodebuild -project FunCity.xcodeproj -scheme FunCity -configuration Release \
            -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build
